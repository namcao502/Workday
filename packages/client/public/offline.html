<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workday</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1c1c1e;
        color: #f2f2f7;
        font-family: system-ui, sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      p {
        margin: 0;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <p id="message">Workday server is not running, retrying...</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('vi')) {
        document.documentElement.lang = 'vi'
        document.getElementById('message').textContent = 'Server Workday chưa chạy, đang thử lại...'
      }
      setInterval(function () {
        fetch('/api/health', { cache: 'no-store' })
          .then(function (response) {
            if (response.ok) {
              location.replace('/')
            }
          })
          .catch(function () {})
      }, 3000)
    </script>
  </body>
</html>
